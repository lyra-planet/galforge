<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>游戏名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=VT323&display=swap">
<style>
/* 布局：横屏时 16:9 舞台居中，对话框压在画面底部；竖屏时画面在上、对话框在下。字体栈每一层都带中文字体
 * 设置页改的字号、对话框不透明度写在 #prefCss 里：--fs（1–2）、--ba（0.4–1） */
:root {
  --ink: #16131c; --panel: #1f1d2b; --line: #4a4660; --text: #f7f4ee; --muted: #9a97ab; --soft: #e2dcef;
  /* --accent 是占位的中性色：开工后换成本作主色（见 SKILL 美术一步）；--warn 警示、--clue 线索是功能色 */
  --accent: #cdc4b2; --warn: #e5707a; --clue: #79b58f;
  --f-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-pixel: "VT323", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #000; color: var(--text); font-family: var(--f-body); overflow: hidden; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
#app { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden; background: var(--ink); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#stage { position: absolute; inset: 0; }
#scene { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.on { animation: flash .6s; }
#flash.white { animation: flashw .8s; }
#flash.black { background: #000; animation: flashw .8s; }
#flash.soft { animation: flashsoft .6s !important; } /* 减少闪光：只淡淡亮一下 */
#app.shake #stage { animation: shake .4s; }
#app.shake2 #stage { animation: shake2 .5s; }
#app.hshake #stage { animation: hshake .4s; }
#app.fade #stage { animation: fadeblack 1.2s; }
#app.hideui .hud, #app.hideui #dock { visibility: hidden; }

.hud { position: absolute; top: 1.4cqw; left: 1.4cqw; right: 1.4cqw; display: flex; justify-content: space-between; align-items: flex-start; gap: 1cqw; flex-wrap: wrap; z-index: 2; }
.where { font-size: max(12px, 1.6cqw); line-height: 1.2; background: rgba(22,19,28,.72); border-radius: 999px; padding: .45cqw 1.3cqw; display: flex; gap: .9cqw; align-items: baseline; }
.where b { font-family: var(--f-pixel); font-weight: 400; font-size: 1.15em; }
.where span { color: var(--muted); }
.where i { font-style: normal; color: var(--accent); font-family: var(--f-display); }
/* 数值仪表（registry R.METERS）：HUD 上常驻显示几个数值，过了 warn 变警示色 */
.meters { display: flex; flex-wrap: wrap; gap: .5cqw; margin-top: .5cqw; }
.meter { font-size: max(11px, 1.35cqw); background: rgba(22,19,28,.72); border-radius: .4cqw; padding: .25cqw .8cqw; color: var(--soft); }
.meter b { font-family: var(--f-pixel); font-weight: 400; font-size: 1.15em; margin-left: .4em; color: var(--text); }
.meter.warn b { color: var(--warn); }
.tools { display: flex; gap: .5cqw; flex-wrap: wrap; justify-content: flex-end; }
.tool { font-size: max(12px, 1.5cqw); line-height: 1.2; background: rgba(22,19,28,.72); border: 0; border-radius: 999px; padding: .4cqw 1.1cqw; }
.tool[aria-pressed="true"], .btn[aria-pressed="true"] { background: var(--accent); color: var(--ink); }
.tool:focus-visible, .btn:focus-visible, .cell:focus-visible, .choice:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#dock { position: absolute; left: 3cqw; right: 3cqw; bottom: 1.8cqw; display: flex; flex-direction: column; gap: 1cqw; z-index: 2; }
#box, .demo { background: linear-gradient(rgb(31 29 43 / calc(.9 * var(--ba, 1))), rgb(22 19 28 / calc(.94 * var(--ba, 1)))); border: 2px solid rgb(255 255 255 / calc(.16 * var(--ba, 1))); border-radius: 1.4cqw; }
#box { position: relative; padding: 2cqw 2.6cqw 1.8cqw; min-height: 11cqw; box-shadow: 0 .6cqw 2cqw rgba(0,0,0,.4); }
#name { position: absolute; top: 0; left: 2.2cqw; transform: translateY(-58%); background: var(--accent); color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: max(13px, 1.8cqw); padding: .3cqw 1.6cqw; border-radius: 999px; box-shadow: 0 .3cqw .8cqw rgba(0,0,0,.35); }
#txt, .demo { font-size: calc(max(15px, 2.15cqw) * var(--fs, 1)); line-height: 1.7; }
#txt { min-height: 3.4em; }
#box.narr #txt { color: var(--soft); }
#next { position: absolute; right: 1.8cqw; bottom: 1cqw; color: var(--accent); animation: bob 1s ease-in-out infinite; font-size: max(12px, 1.4cqw); }
/* 文字标记：整句先排好，没打到的字只是看不见（不会跳行） */
.tk.h { visibility: hidden; }
.tk-big { font-size: 1.5em; line-height: 1; }
.tk-red { color: var(--warn); }
.tk-shake { display: inline-block; animation: tshake .16s steps(2) infinite alternate; }
.tk-shake:nth-child(2n) { animation-duration: .13s; animation-delay: -.07s; }
#app.calm .tk-shake { animation: none; }
/* 选项放在画面上部（HUD 下面），避开立绘脸部所在的 41%–56% 高度 */
#choices { position: absolute; top: 6.5cqw; left: 50%; transform: translateX(-50%); width: min(62%, 100%); display: grid; gap: .9cqw; z-index: 3; }
.choice { position: relative; text-align: center; background: rgba(247,244,238,.94); color: var(--ink); border: 0; border-radius: 999px; padding: 1cqw 3cqw; font-size: max(14px, 1.9cqw); line-height: 1.45; box-shadow: 0 .4cqw 1.2cqw rgba(0,0,0,.35); transition: transform .12s, background .12s; }
.choice::before { content: attr(data-k); position: absolute; left: 1.6cqw; top: 50%; transform: translateY(-50%); font-family: var(--f-pixel); color: var(--accent); }
.choice:hover, .choice:focus-visible { background: var(--accent); transform: scale(1.02); outline: none; }
.choice.clue { box-shadow: 0 0 0 2px var(--clue), 0 .4cqw 1.2cqw rgba(0,0,0,.35); }
.fuse-label { text-align: center; color: var(--warn); font-size: max(12px, 1.6cqw); letter-spacing: .1em; }
#choices.paused .fuse-label::after { content: " · 暂停中"; color: var(--muted); }
.fuse { height: 4px; background: rgba(255,255,255,.2); border-radius: 2px; }
.fuse span { display: block; height: 100%; width: 100%; background: var(--warn); border-radius: 2px; } /* 宽度由画面循环按剩余时间改 */

#toast { position: absolute; top: 6cqw; left: 50%; transform: translate(-50%, -8px); opacity: 0; transition: opacity .3s, transform .3s; background: rgba(22,19,28,.92); border-radius: 999px; padding: .6cqw 1.8cqw; font-size: max(13px, 1.6cqw); z-index: 9; pointer-events: none; white-space: nowrap; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast small { color: var(--accent); margin-right: .8cqw; font-size: 1em; }
#card { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: rgba(16,14,22,.9); z-index: 4; animation: fadein .5s; }
#card h3 { font-family: var(--f-display); font-size: max(24px, 4.4cqw); margin: 0; letter-spacing: .08em; }
#card p { color: var(--accent); letter-spacing: .2em; font-size: max(14px, 2cqw); margin: 1cqw 0 0; }

.ov { position: absolute; inset: 0; background: rgba(16,14,22,.95); padding: 4.5cqw 6cqw; overflow: auto; z-index: 5; }
.ov h2 { font-family: var(--f-display); font-size: max(20px, 3.2cqw); margin: 0 0 1cqw; }
.eyebrow { color: var(--accent); letter-spacing: .18em; font-size: max(12px, 1.6cqw); margin: 0; }
.lede { color: var(--muted); font-size: max(13px, 1.6cqw); line-height: 1.6; margin: .6cqw 0; }
.warnline { color: var(--warn); }
.row { display: flex; gap: 1cqw; flex-wrap: wrap; margin-top: 2cqw; }
.row.sub { margin-top: .8cqw; gap: .4cqw; }
.btn { background: rgba(255,255,255,.08); border: 0; border-radius: 999px; padding: .9cqw 2.4cqw; font-size: max(14px, 1.8cqw); }
.btn.primary { background: var(--accent); color: var(--ink); font-weight: 700; }
.row.sub .btn { background: none; color: var(--muted); font-size: max(12px, 1.4cqw); padding: .5cqw 1.4cqw; }
.row.sub .btn[aria-expanded="true"] { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 1.2cqw; }
.cell { text-align: left; background: rgba(255,255,255,.06); border: 0; border-radius: 1.2cqw; padding: 1.2cqw 1.4cqw; display: grid; gap: .4cqw; font-size: max(13px, 1.6cqw); }
.cell b { font-family: var(--f-display); font-weight: 600; font-size: 1.1em; }
.cell span { color: var(--muted); line-height: 1.5; }
.cell i { font-style: normal; color: var(--accent); font-size: .9em; }
.cell canvas { width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; border-radius: .6cqw; background: #000; }
.cell:disabled { opacity: .45; cursor: default; }
#title { background: linear-gradient(rgba(16,14,22,0) 35%, rgba(16,14,22,.88) 78%); display: flex; flex-direction: column; justify-content: flex-end; }
#title h1 { font-family: var(--f-display); font-size: max(30px, 6.2cqw); margin: .3cqw 0; letter-spacing: .08em; text-shadow: 0 .4cqw 1.6cqw rgba(0,0,0,.5); }
#tInfo { max-width: 46em; color: var(--soft); }
.group { color: var(--muted); margin: 2cqw 0 .8cqw; letter-spacing: .1em; font-size: max(13px, 1.6cqw); }
.note { background: rgba(255,255,255,.06); border-radius: 1cqw; padding: 1cqw 1.4cqw; margin-bottom: .8cqw; font-size: max(13px, 1.6cqw); }
.note b { color: var(--accent); font-weight: 500; }
.note p { margin: .3cqw 0 0; color: var(--soft); line-height: 1.6; }
.note.unk { color: var(--muted); }
#logList p { margin: .6cqw 0; line-height: 1.6; font-size: max(13px, 1.6cqw); }
#logList b { color: var(--accent); margin-right: .8em; font-weight: 500; }
#logList p.n { color: #c7c1d6; }
#cgBig { width: 100%; max-height: 70%; aspect-ratio: 16 / 9; image-rendering: pixelated; border-radius: 1cqw; }
/* 设置页 */
.pref { display: grid; grid-template-columns: minmax(7em, 11em) 1fr; gap: .4cqw 1.6cqw; align-items: center; margin: .7cqw 0; font-size: max(13px, 1.6cqw); }
.pref > span { color: var(--soft); }
.seg { display: flex; flex-wrap: wrap; gap: .5cqw; }
.seg button { background: rgba(255,255,255,.08); border: 0; border-radius: 999px; padding: .45cqw 1.5cqw; font-size: max(13px, 1.5cqw); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--ink); font-weight: 700; }
.demo-bg { background: linear-gradient(120deg, #8ec3ea, #f29a62); border-radius: 1.6cqw; padding: 1.2cqw; margin: 1cqw 0; }
.demo { padding: 1.2cqw 2cqw; }
/* 页内确认：盖在别的浮层上面 */
#confirmOv { z-index: 8; display: grid; place-content: center; text-align: center; background: rgba(16,14,22,.86); }
#confirmOv .row { justify-content: center; }

@keyframes shake { 0%, 100% { transform: none } 25% { transform: translate(-1cqw, .4cqw) } 50% { transform: translate(1cqw, -.4cqw) } 75% { transform: translate(-.5cqw, 0) } }
@keyframes shake2 { 0%, 100% { transform: none } 20% { transform: translate(-2cqw, .8cqw) } 40% { transform: translate(2cqw, -.8cqw) } 60% { transform: translate(-1.4cqw, .4cqw) } 80% { transform: translate(1cqw, 0) } }
@keyframes hshake { 0%, 100% { transform: none } 20% { transform: translateX(-1.2cqw) } 40% { transform: translateX(1.2cqw) } 60% { transform: translateX(-.8cqw) } 80% { transform: translateX(.5cqw) } }
@keyframes tshake { from { transform: translate(-.08em, .04em) } to { transform: translate(.08em, -.04em) } }
@keyframes flash { from { opacity: .9 } to { opacity: 0 } }
@keyframes flashw { 0%, 20% { opacity: 1 } to { opacity: 0 } }
@keyframes flashsoft { from { opacity: .25 } to { opacity: 0 } }
@keyframes fadeblack { from { filter: brightness(0) } to { filter: none } }
@keyframes fadein { from { opacity: 0 } }
@keyframes bob { 50% { transform: translateY(3px) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* 竖屏：画面在上，对话框和选项在下面单独一块，字号按屏宽放大 */
@media (max-aspect-ratio: 1/1) {
  body { display: block; }
  #app { width: 100vw; height: 100vh; height: 100dvh; aspect-ratio: auto; display: flex; flex-direction: column; }
  #stage { position: relative; inset: auto; width: 100%; aspect-ratio: 16 / 9; flex: none; }
  #dock { position: relative; left: auto; right: auto; bottom: auto; flex: none; padding: 6cqw 4cqw 2cqw; }
  #box { min-height: 30cqw; padding: 5cqw 4.5cqw 5cqw; border-radius: 3cqw; }
  #name { font-size: 3.8cqw; left: 4cqw; }
  #txt, .demo { font-size: calc(max(15px, 4.3cqw) * var(--fs, 1)); }
  #choices { position: relative; top: auto; left: auto; transform: none; width: auto; padding: 2cqw 4cqw 4cqw; gap: 2.4cqw; align-content: start; overflow: auto; flex: 1; }
  .choice { font-size: max(14px, 4cqw); padding: 2.6cqw 6cqw; }
  .hud { top: 2cqw; left: 2cqw; right: 2cqw; flex-wrap: nowrap; }
  /* 竖屏：时间、地点、仪表挤在左边一栏，按钮留在同一行右上角，不被挤到第二行压住人脸；章名在标题卡上看过了，HUD 里省掉 */
  .hud > div:first-child { flex: 1 1 auto; min-width: 0; }
  #hCh { display: none; }
  .tools { flex: none; flex-wrap: nowrap; }
  .meters { flex-wrap: wrap; gap: 1cqw; }
  .meter { font-size: max(10px, 2.7cqw); }
  .where, .tool { font-size: max(11px, 3cqw); }
  .tool { padding: 0 3cqw; }
  .ov { padding: 8cqw 6cqw; }
  .lede, .cell, .note, #logList p, .group, .pref { font-size: max(13px, 3.6cqw); }
  .btn { font-size: max(14px, 4cqw); padding: 2cqw 4.5cqw; }
  .row.sub .btn { font-size: max(13px, 3.4cqw); }
  .pref { grid-template-columns: 1fr; margin: 2.4cqw 0; }
  .seg { gap: 1.6cqw; }
  .seg button { font-size: max(13px, 3.6cqw); padding: 1.2cqw 3.4cqw; }
  #toast { top: 60cqw; font-size: max(13px, 3.6cqw); }
}
/* 手机（竖屏或触屏）：HUD 只留「记录 / 自动 / 快进 / 菜单」，其余在菜单里；能点的东西至少 44px 高 */
@media (max-aspect-ratio: 1/1), (pointer: coarse) {
  .tool.wide { display: none; }
  .tool, .btn, .choice, .seg button { min-height: 44px; }
  .tool { min-width: 44px; }
}
</style>
<style id="prefCss"></style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="scene" width="480" height="270" aria-label="游戏画面"></canvas>
    <div id="flash"></div>
    <div class="hud" id="hud" hidden>
      <div><div class="where"><b id="hTime"></b><span id="hPlace"></span><i id="hCh"></i></div><div class="meters" id="hMeters" hidden></div></div>
      <div class="tools">
        <button class="tool wide" id="bClues" type="button" hidden>线索 <span id="nClues">0</span></button>
        <button class="tool" id="bLog" type="button">记录</button>
        <button class="tool" id="bAuto" type="button" aria-pressed="false">自动</button>
        <button class="tool" id="bSkip" type="button" aria-pressed="false">快进</button>
        <button class="tool wide" id="bSave" type="button">存档</button>
        <button class="tool wide" id="bPref" type="button">设置</button>
        <button class="tool wide" id="bHide" type="button">隐藏</button>
        <button class="tool wide" id="bMute" type="button" aria-pressed="false">静音</button>
        <button class="tool" id="bMenu" type="button">菜单</button>
      </div>
    </div>
  </div>
  <div id="dock">
    <div id="box" hidden><div id="name"></div><div id="txt"></div><span id="next">▼</span></div>
  </div>
  <div id="choices" hidden></div>
  <div id="toast"><small id="toastIcon">+</small><span id="toastText"></span></div>
  <div id="card" hidden><h3 id="cardH"></h3><p id="cardP"></p></div>

  <div class="ov" id="title">
    <p class="eyebrow" id="tEyebrow"></p>
    <h1 id="tName"></h1>
    <p class="lede" id="tSub"></p>
    <p class="lede warnline" id="tWarn" hidden>这个浏览器不允许本地存储（或空间已满）：进度和存档都不会保存。</p>
    <div class="row">
      <button class="btn primary" id="bNew" type="button">新游戏</button>
      <button class="btn" id="bCont" type="button" hidden>继续</button>
      <button class="btn" id="bLoad" type="button">读档</button>
      <button class="btn" id="bChap" type="button">章节</button>
      <button class="btn" id="bGallery" type="button">回想</button>
      <button class="btn" id="bTPref" type="button">设置</button>
    </div>
    <div class="row sub">
      <button class="btn" id="bCw" type="button" aria-expanded="false" hidden>内容提示</button>
      <button class="btn" id="bCredits" type="button" aria-expanded="false" hidden>制作说明</button>
    </div>
    <p class="lede" id="tInfo" hidden></p>
  </div>
  <div class="ov" id="notes" hidden><h2>线索</h2><div id="notesList"></div><div class="row"><button class="btn primary" type="button" data-close>返回</button></div></div>
  <div class="ov" id="logOv" hidden><h2>记录</h2><div id="logList"></div><div class="row"><button class="btn primary" type="button" data-close>返回</button></div></div>
  <div class="ov" id="slotOv" hidden><h2 id="slotTitle">存档</h2><p class="lede">进度也会自动保存，「继续」读的是自动存档。</p><div class="grid" id="slotGrid"></div><div class="row"><button class="btn" type="button" data-close>返回</button></div></div>
  <div class="ov" id="chapOv" hidden><h2>章节</h2><p class="lede">从这一章开头重玩：数值、线索回到第一次进这章时的样子。</p><div class="grid" id="chapGrid"></div><div class="row"><button class="btn" type="button" data-close>返回</button></div></div>
  <div class="ov" id="galOv" hidden>
    <h2>回想</h2><p class="lede" id="galCount"></p><div class="grid" id="cgGrid"></div>
    <h2 style="margin-top:3cqw">结局</h2><div class="grid" id="endGrid"></div>
    <div class="row"><button class="btn" type="button" data-close>返回</button></div>
  </div>
  <div class="ov" id="cgOv" hidden><canvas id="cgBig" width="480" height="270"></canvas><div class="row"><button class="btn primary" type="button" data-close>返回</button></div></div>
  <div class="ov" id="menuOv" hidden>
    <h2>菜单</h2>
    <div class="row">
      <button class="btn primary" type="button" data-close>继续</button>
      <button class="btn" id="bMenuSave" type="button">存档</button>
      <button class="btn" id="bMenuLoad" type="button">读档</button>
      <button class="btn" id="bMenuPref" type="button">设置</button>
      <button class="btn" id="bMenuChap" type="button">章节</button>
      <button class="btn" id="bMenuClues" type="button" hidden>线索</button>
      <button class="btn" id="bMenuHide" type="button">隐藏界面</button>
      <button class="btn" id="bMenuMute" type="button" aria-pressed="false">静音</button>
      <button class="btn" id="bMenuTitle" type="button">回到标题</button>
    </div>
    <p class="lede">快捷键：空格 / 回车继续，数字键选选项，按住 Ctrl 快进，H 隐藏界面，Esc 或右键开菜单，滚轮上 / PageUp 看记录。</p>
  </div>
  <div class="ov" id="prefOv" hidden>
    <h2>设置</h2>
    <div class="demo-bg"><div class="demo">对话框里的字是这么大。</div></div>
    <div id="prefList"></div>
    <div class="row"><button class="btn primary" type="button" data-close>返回</button></div>
  </div>

/* ---------- 条件：线索 / flag / 好感比较 ---------- */

/* ---------- 舞台：谁站在哪、什么表情、穿什么、什么姿势；换位置滑过去，enter / exit 从画外进出 ---------- */

/* ---------- 声音：bgm（"none" 3 秒淡出 / { id, fade } 慢慢进）、bgmVol 压低、amb 环境音；都记在 S 里，读档时原样接上 ---------- */

/* ---------- 章节流程（registry.FLOW + 章末跳转）；章首快照：重玩一章不会把好感加两遍 ---------- */

// 台词第 4 项：省略 / "off"（画外音）/ 表情符号名 / { off, emote, pose, act, who, jump, sfx, outfit, weather, props, stage, enter, exit, fx, amb, bgm, need, needNot }

/* ---------- 打字机：文字标记 {w} {w=1.2} 停顿、{slow}…{/slow} {slow=300} 慢速、{big} {red} {shake} 样式

const MARK = /\{(\/?)(w|slow|big|red|shake)(?:=([\d.]+))?\}/g;

  S = Object.assign(fresh(), st); hideAll(); Music.unlock(); leaving.length = 0;
  for (const c of Object.values(S.stage)) Object.assign(fxOf(c.id), { born: now() - 1000, moveAt: null });
  if (S.node === "__hub") { const nx = nextChapter(); if (nx && nx.hub) return showHub(nx.hub); }
  if (NODES[S.node]) { $("hud").hidden = false; return go(S.node, { resume: true, line: Math.min(S.line, (NODES[S.node].lines || []).length) }); }
  const nx = nextChapter(); if (nx) return nx.hub ? showHub(nx.hub) : startChapter(nx);
  toTitle();
}
function toTitle() {
  stopVoice(); hideAll(); hideChoices(); setSkip(false); $("box").hidden = true; $("hud").hidden = true; startTrans("dissolve");
  S.scene = T.scene || S.scene; S.tod = T.tod || "day"; S.stage = {}; S.red = false;
  $("bCont").hidden = !canResume(store.get("save")); $("title").hidden = false; Music.play("none"); Music.amb("none");
}
function newGame() { Music.unlock(); S = fresh(); const nx = nextChapter(); if (nx) (nx.hub ? showHub(nx.hub) : startChapter(nx)); }

/* ---------- 设置（store "prefs"） ---------- */
const VOLS = [[0, "关"], [0.25, "25%"], [0.5, "50%"], [0.75, "75%"], [1, "100%"]];
const PREF_UI = [
  ["cps", "文字速度", [[20, "慢"], [36, "中"], [70, "快"], [0, "瞬间"]]],
  ["auto", "自动播放", [[1.5, "慢"], [1, "中"], [0.6, "快"]]],
  ["bgm", "音乐音量", VOLS], ["sfx", "音效与环境音", VOLS], ["voice", "语音音量", VOLS],
  ["fontScale", "字号", [[1, "100%"], [1.25, "125%"], [1.5, "150%"], [1.75, "175%"], [2, "200%"]]],
  ["boxAlpha", "对话框不透明度", [[0.4, "40%"], [0.7, "70%"], [1, "100%"]]],
  ["calm", "减少闪光与震屏", [[false, "关"], [true, "开"]]],
  ["timer", "限时选项", [["normal", "正常"], ["double", "时间加倍"], ["off", "不限时"]]],
  ["skipAll", "快进", [[false, "只快进读过的"], [true, "全部"]]],
];
function applyPrefs() {
  $("prefCss").textContent = `#app { --fs: ${+prefs.fontScale || 1}; --ba: ${+prefs.boxAlpha || 1}; }`;
  $("app").classList.toggle("calm", !!prefs.calm);
  Music.setVolume("music", prefs.bgm); Music.setVolume("sfx", prefs.sfx); Music.setVolume("amb", prefs.sfx); // 环境音跟音效一路
  voice.volume = prefs.voice;
}
function renderPrefs() {
  const list = $("prefList"); list.innerHTML = "";
  for (const [k, label, opts] of PREF_UI) {
    const row = document.createElement("div"), name = document.createElement("span"), seg = document.createElement("div");
    row.className = "pref"; seg.className = "seg"; name.textContent = label;
    for (const [v, t] of opts) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.dataset.pref = k; b.setAttribute("aria-pressed", prefs[k] === v);
      b.onclick = e => { e.stopPropagation(); prefs[k] = v; store.set("prefs", prefs); applyPrefs(); for (const x of seg.children) x.setAttribute("aria-pressed", x === b); };
      seg.append(b);
    }
    row.append(name, seg); list.append(row);
  }
}
const openPrefs = () => { renderPrefs(); openOv("prefOv"); };
function info(k) { // 标题页：内容提示 / 制作说明，点一下展开，再点收起
  const p = $("tInfo"), shut = !p.hidden && p.dataset.k === k;
  p.hidden = shut; p.dataset.k = k;
  p.textContent = k === "cw" ? `内容提示：${(T.cw || []).join("、")}。` : T.credits || "";
  $("bCw").setAttribute("aria-expanded", !shut && k === "cw"); $("bCredits").setAttribute("aria-expanded", !shut && k === "credits");
}
function toggleMute() { Music.unlock(); Music.setMuted(!Music.muted); voice.muted = Music.muted; for (const id of ["bMute", "bMenuMute"]) $(id).setAttribute("aria-pressed", Music.muted); }

/* ---------- 输入 ---------- */
const fromMenu = f => e => { e.stopPropagation(); $("menuOv").hidden = true; f(); }; // 菜单里跳到另一层（不经过「全关了」）
$("bNew").onclick = e => { if (e) e.stopPropagation(); if (canResume(store.get("save"))) ask("开始新游戏？", "「继续」的进度会被新游戏覆盖；手动存档不受影响。", "开始新游戏", newGame); else newGame(); };
$("bCont").onclick = e => { e.stopPropagation(); const sv = store.get("save"); if (sv) loadState(sv); };
$("bLoad").onclick = e => { e.stopPropagation(); renderSlots("load"); openOv("slotOv"); };
$("bChap").onclick = e => { e.stopPropagation(); renderChapters(); openOv("chapOv"); };
$("bGallery").onclick = e => { e.stopPropagation(); renderGallery(); openOv("galOv"); };
$("bTPref").onclick = e => { e.stopPropagation(); openPrefs(); };
$("bCw").onclick = e => { e.stopPropagation(); info("cw"); };
$("bCredits").onclick = e => { e.stopPropagation(); info("credits"); };
$("bClues").onclick = e => { e.stopPropagation(); renderNotes(); openOv("notes"); };
$("bLog").onclick = e => { e.stopPropagation(); openLog(); };
$("bSave").onclick = e => { e.stopPropagation(); renderSlots("save"); openOv("slotOv"); };
$("bPref").onclick = e => { e.stopPropagation(); openPrefs(); };
$("bAuto").onclick = e => { e.stopPropagation(); auto = !auto; $("bAuto").setAttribute("aria-pressed", auto); if (auto && !typing && $("choices").hidden) lineDone(); else clearTimeout(autoT); };
$("bSkip").onclick = e => { e.stopPropagation(); setSkip(!skip); };
$("bHide").onclick = e => { e.stopPropagation(); $("app").classList.add("hideui"); };
$("bMute").onclick = e => { e.stopPropagation(); toggleMute(); };
$("bMenu").onclick = e => { e.stopPropagation(); openOv("menuOv"); };
$("bMenuSave").onclick = fromMenu(() => { renderSlots("save"); openOv("slotOv"); });
$("bMenuLoad").onclick = fromMenu(() => { renderSlots("load"); openOv("slotOv"); });
$("bMenuPref").onclick = fromMenu(openPrefs);
$("bMenuChap").onclick = fromMenu(() => { renderChapters(); openOv("chapOv"); });
$("bMenuClues").onclick = fromMenu(() => { renderNotes(); openOv("notes"); });
$("bMenuHide").onclick = e => { e.stopPropagation(); closeOv("menuOv"); $("app").classList.add("hideui"); };
$("bMenuMute").onclick = e => { e.stopPropagation(); toggleMute(); };
$("bMenuTitle").onclick = e => { e.stopPropagation(); toTitle(); };
$("bToTitle").onclick = e => { e.stopPropagation(); toTitle(); };
$("bReplay").onclick = e => { e.stopPropagation(); if (S.ch) startChapter(S.ch, "replay"); };
$("cfYes").onclick = e => { e.stopPropagation(); const f = cfThen; cfThen = null; closeOv("confirmOv"); if (f) f(); };
$("cfNo").onclick = e => { e.stopPropagation(); cfThen = null; closeOv("confirmOv"); };
document.querySelectorAll("[data-close]").forEach(b => (b.onclick = e => { e.stopPropagation(); closeOv(b.closest(".ov").id); }));
$("app").onclick = e => {
  if ($("app").classList.contains("hideui")) { $("app").classList.remove("hideui"); return; }
  if (e.target.closest("button, .ov")) return; Music.unlock(); setSkip(false); advance();
};
$("app").addEventListener("contextmenu", e => { e.preventDefault(); back(); }); // 右键 = 菜单（再按一下关掉）
const inGame = () => !$("hud").hidden && !anyOverlay();
window.addEventListener("wheel", e => { if (e.deltaY < 0 && inGame()) openLog(); }, { passive: true }); // 滚轮往上 = 记录
window.addEventListener("keydown", e => {
  if (e.key === "Control") { if (!skip && !anyOverlay()) setSkip(true); return; }
  if (e.key === "Escape") return back();
  if ($("app").classList.contains("hideui")) { $("app").classList.remove("hideui"); return; }
  if (e.key === " " || e.key === "Enter") { if (document.activeElement && document.activeElement.tagName === "BUTTON" && e.key === "Enter") return; e.preventDefault(); advance(); }
  else if (/^[1-9]$/.test(e.key) && !$("choices").hidden) { const c = $("choices")._vis[+e.key - 1]; if (c) choose(c); }
  else if (e.key === "h" || e.key === "H") { if (inGame()) $("app").classList.add("hideui"); }
  else if (e.key === "PageUp") { if (inGame()) { e.preventDefault(); openLog(); } }
});
window.addEventListener("keyup", e => { if (e.key === "Control") setSkip(false); });

/* ---------- 启动 ---------- */
(function boot() {
  document.title = T.name || document.title;
  $("tName").textContent = T.name || ""; $("tSub").textContent = T.sub || ""; $("tEyebrow").textContent = T.eyebrow || "";
  $("bClues").hidden = $("bMenuClues").hidden = !Object.keys(R.CLUES || {}).length;
  $("bCw").hidden = !(T.cw && T.cw.length); $("bCredits").hidden = !T.credits;
  applyPrefs();
  $("tWarn").hidden = store.set("probe", 1); try { localStorage.removeItem(NS + "probe"); } catch (e) {} // 试写一次：写不进去就在标题页常驻提示
  const sv = store.get("save"); // 读进来：从标题页进「章节」时用得上章首快照；「新游戏」会重置
  if (sv) S = Object.assign(fresh(), sv, { scene: fresh().scene, tod: fresh().tod, stage: {}, red: false, speaker: null });
  $("bCont").hidden = !canResume(sv);
  const q = new URLSearchParams(location.search).get("ch");
  if (q && CH[q]) { hideAll(); startChapter(q, "replay"); }
})();
</script>
</body>
